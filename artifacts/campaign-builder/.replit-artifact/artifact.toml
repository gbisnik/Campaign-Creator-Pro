kind = "web"
previewPath = "/"
title = "Smart Campaign Builder"
version = "1.0.0"
id = "artifacts/campaign-builder"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18283

[services.development]
run = "pnpm --filter @workspace/campaign-builder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/campaign-builder", "run", "build" ]
publicDir = "artifacts/campaign-builder/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18283"
BASE_PATH = "/"
